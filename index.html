<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Profile Picture Cropper</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f2fb;--card:#fff;--text:#1f2430;--muted:#6b7280;--accent:#7b46ff;--accent2:#6228e6;--border:#e5e7eb;--inp:#fff;--soft:#f8f9fa;--shadow:0 10px 30px rgba(0,0,0,.1);color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e0b1a;--card:#171326;--text:#e8e6f2;--muted:#9a97ad;--border:#2b2640;--inp:#0f0c1c;--soft:#1d1830;--shadow:none;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e0b1a;--card:#171326;--text:#e8e6f2;--muted:#9a97ad;--border:#2b2640;--inp:#0f0c1c;--soft:#1d1830;--shadow:none;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,Arial,sans-serif;background:var(--bg);color:var(--text)}
.wrap{max-width:1000px;margin:0 auto;padding:14px}
.tool{background:var(--card);border-radius:14px;padding:20px;box-shadow:var(--shadow);border:1px solid var(--border)}
h1{font-size:20px;margin:0 0 4px}p.sub{margin:0 0 14px;color:var(--muted);font-size:13px}
#drop{border:2px dashed var(--accent);padding:32px 16px;text-align:center;border-radius:10px;cursor:pointer;transition:.2s;color:var(--muted);font-size:14px}
#drop:hover,#drop.over{background:rgba(123,70,255,.08)}#drop strong{color:var(--accent)}
.grid{display:grid;grid-template-columns:1fr 320px;gap:20px;margin-top:18px}
.grid.hide{display:none}
#stage{width:100%;height:440px;background:#1f2430;border-radius:10px;position:relative;touch-action:none;overflow:hidden;cursor:grab}
#stage:active{cursor:grabbing}#cv{width:100%;height:100%;display:block}
.hint{font-size:12px;color:var(--muted);margin:8px 0 0;text-align:center}
.panel{background:var(--soft);border-radius:10px;padding:16px;min-width:0}
.g{margin-bottom:12px}
label{display:block;font-weight:600;font-size:13px;margin-bottom:5px}
select,input[type=number],input[type=color]{width:100%;padding:10px;border:1px solid var(--border);border-radius:6px;background:var(--inp);color:var(--text);font-size:16px;font-family:inherit}
input[type=color]{padding:2px;height:42px}input[type=range]{width:100%;accent-color:var(--accent)}
.r2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tools{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.tb{padding:10px 0;border:1px solid var(--border);background:var(--inp);color:var(--text);border-radius:6px;font-size:13px;cursor:pointer;font-family:inherit}
.tb:hover{border-color:var(--accent)}
.chk{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600}.chk input{width:auto;margin:0}
.btn{background:var(--accent);color:#fff;border:none;padding:14px;width:100%;font-size:16px;font-weight:700;border-radius:6px;cursor:pointer;margin-top:8px;font-family:inherit}
.btn:hover{background:var(--accent2)}.btn.s{background:var(--inp);color:var(--text);border:1px solid var(--border);font-size:14px;font-weight:600;padding:11px}
.pv{display:flex;gap:12px;align-items:center}#pv{border:1px solid var(--border);background:repeating-conic-gradient(#ccc 0 25%,#fff 0 50%) 0/12px 12px;border-radius:6px}
#info{font-size:12px;color:var(--muted);line-height:1.5}
#msg{font-size:12px;min-height:16px;margin-top:8px;color:var(--muted)}
.sec{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:14px 0 8px;font-weight:700}
@media (max-width:820px){.grid{grid-template-columns:1fr}#stage{height:min(calc(100vw - 56px),420px)}.wrap{padding:10px}.tool{padding:14px}}
</style>
</head>
<body>
<div class="wrap"><div class="tool">
<h1>Profile Picture Cropper</h1>
<p class="sub">Crop, resize and export profile pictures and banners for any platform. Your image never leaves your device.</p>
<div id="drop"><strong>Click to upload an image</strong>, drag &amp; drop, or paste (Ctrl+V)<input type="file" id="file" accept="image/*" hidden></div>

<div class="grid hide" id="main">
  <div>
    <div id="stage"><canvas id="cv"></canvas></div>
    <p class="hint">Drag to move. Scroll, pinch or use the slider to zoom.</p>
  </div>
  <div class="panel">
    <div class="g"><label for="preset">Platform / size</label>
      <select id="preset">
        <option value="500x500">Custom size</option>
        <optgroup label="Profile pictures">
          <option value="320x320">Facebook Profile (320x320)</option>
          <option value="320x320">Instagram Profile (320x320)</option>
          <option value="400x400" selected>X / Twitter (400x400)</option>
          <option value="400x400">LinkedIn Profile (400x400)</option>
          <option value="800x800">YouTube Channel (800x800)</option>
          <option value="200x200">TikTok Profile (200x200)</option>
          <option value="128x128">Discord Avatar (128x128)</option>
          <option value="640x640">WhatsApp Profile (640x640)</option>
          <option value="512x512">Telegram (512x512)</option>
          <option value="256x256">Twitch (256x256)</option>
          <option value="500x500">GitHub (500x500)</option>
          <option value="512x512">Slack (512x512)</option>
        </optgroup>
        <optgroup label="Covers &amp; banners">
          <option value="820x312">Facebook Cover (820x312)</option>
          <option value="1500x500">X / Twitter Header (1500x500)</option>
          <option value="1584x396">LinkedIn Banner (1584x396)</option>
          <option value="2560x1440">YouTube Banner (2560x1440)</option>
          <option value="1280x720">YouTube Thumbnail (1280x720)</option>
        </optgroup>
      </select></div>
    <div class="r2 g"><div><label for="tw">Width (px)</label><input type="number" id="tw" value="400" min="16" max="4096"></div><div><label for="th">Height (px)</label><input type="number" id="th" value="400" min="16" max="4096"></div></div>
    <div class="g"><label for="zoom">Zoom <span id="zv">100%</span></label><input type="range" id="zoom" min="100" max="500" value="100"></div>
    <div class="tools g">
      <button class="tb" id="rl" title="Rotate left">⟲</button><button class="tb" id="rr" title="Rotate right">⟳</button>
      <button class="tb" id="fh" title="Flip horizontal">⇋</button><button class="tb" id="fv" title="Flip vertical">⇅</button>
    </div>
    <div class="g"><label for="shape">Shape</label>
      <select id="shape"><option value="square">Square / rectangle</option><option value="circle">Circle (round avatar)</option><option value="rounded">Rounded corners</option></select></div>
    <div id="filters">
      <div class="sec">Adjustments</div>
      <div class="g"><label for="br">Brightness</label><input type="range" id="br" min="50" max="150" value="100"></div>
      <div class="g"><label for="co">Contrast</label><input type="range" id="co" min="50" max="150" value="100"></div>
      <div class="g"><label for="sa">Saturation</label><input type="range" id="sa" min="0" max="200" value="100"></div>
      <label class="chk g"><input type="checkbox" id="gs">Black &amp; white</label>
    </div>
    <div class="sec">Export</div>
    <div class="r2 g">
      <div><label for="fmt">Format</label><select id="fmt"><option value="image/png">PNG</option><option value="image/jpeg">JPG</option><option value="image/webp">WebP</option></select></div>
      <div><label for="bg">Background</label><input type="color" id="bg" value="#ffffff"></div>
    </div>
    <div class="g" id="qg" style="display:none"><label for="q">Quality <span id="qv">92%</span></label><input type="range" id="q" min="40" max="100" value="92"></div>
    <div class="pv"><canvas id="pv" width="96" height="96"></canvas><div id="info"></div></div>
    <button class="btn" id="dl">Crop &amp; Download</button>
    <div class="r2"><button class="btn s" id="cp">Copy image</button><button class="btn s" id="rs">Reset</button></div>
    <div id="msg"></div>
  </div>
</div>
</div></div>

<script>
const $=id=>document.getElementById(id);
const S={img:null,name:"image",rot:0,fx:1,fy:1,zoom:1,ox:0,oy:0,url:null};
const cv=$("cv"),ctx=cv.getContext("2d"),pvc=$("pv"),pvx=pvc.getContext("2d");
const FILT="filter" in CanvasRenderingContext2D.prototype;
if(!FILT)$("filters").style.display="none";
let CW=0,CH=0;

function msg(t,err){const m=$("msg");m.textContent=t;m.style.color=err?"#dc2626":"var(--muted)"}
function size(){const w=Math.min(4096,Math.max(16,Math.round(+$("tw").value)||500)),h=Math.min(4096,Math.max(16,Math.round(+$("th").value)||500));return[w,h]}
function resize(){
  const r=$("stage").getBoundingClientRect(),d=window.devicePixelRatio||1;
  CW=r.width;CH=r.height;cv.width=CW*d;cv.height=CH*d;ctx.setTransform(d,0,0,d,0,0);render();
}
function frame(){
  const[w,h]=size(),p=18,aw=CW-2*p,ah=CH-2*p,a=w/h;let fw=aw,fh=fw/a;
  if(fh>ah){fh=ah;fw=fh*a}
  return{x:(CW-fw)/2,y:(CH-fh)/2,w:fw,h:fh};
}
function lim(){
  const[w,h]=size(),sw=S.rot%2?S.img.height:S.img.width,sh=S.rot%2?S.img.width:S.img.height;
  const c=Math.max(w/sw,h/sh),wr=c*sw/w*S.zoom,hr=c*sh/h*S.zoom;
  return[(wr-1)/2,(hr-1)/2];
}
function clamp(){const[lx,ly]=lim();S.ox=Math.max(-lx,Math.min(lx,S.ox));S.oy=Math.max(-ly,Math.min(ly,S.oy))}
function filt(){return FILT?`brightness(${$("br").value}%) contrast(${$("co").value}%) saturate(${$("sa").value}%) grayscale(${$("gs").checked?100:0}%)`:"none"}
function drawImg(c,f,alpha){
  const i=S.img,sw=S.rot%2?i.height:i.width,sh=S.rot%2?i.width:i.height,k=Math.max(f.w/sw,f.h/sh)*S.zoom;
  c.save();c.globalAlpha=alpha;if(FILT)c.filter=filt();c.imageSmoothingQuality="high";
  c.translate(f.x+f.w/2+S.ox*f.w,f.y+f.h/2+S.oy*f.h);c.rotate(S.rot*Math.PI/2);c.scale(S.fx*k,S.fy*k);
  c.drawImage(i,-i.width/2,-i.height/2);c.restore();
}
function path(c,f,shape){
  c.beginPath();
  if(shape==="circle")c.ellipse(f.x+f.w/2,f.y+f.h/2,f.w/2,f.h/2,0,0,Math.PI*2);
  else if(shape==="rounded"){const r=Math.min(f.w,f.h)*.2,x=f.x,y=f.y,w=f.w,h=f.h;c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}
  else c.rect(f.x,f.y,f.w,f.h);
}
function render(){
  if(!S.img||!CW)return;
  clamp();const f=frame(),shape=$("shape").value,[w,h]=size();
  ctx.clearRect(0,0,CW,CH);ctx.fillStyle="#1f2430";ctx.fillRect(0,0,CW,CH);
  drawImg(ctx,f,.4);
  ctx.save();ctx.beginPath();ctx.rect(f.x,f.y,f.w,f.h);ctx.clip();drawImg(ctx,f,1);ctx.restore();
  if(shape!=="square"){
    ctx.save();ctx.beginPath();ctx.rect(f.x,f.y,f.w,f.h);
    const s=ctx;path(s,f,shape);ctx.restore();
    ctx.save();ctx.fillStyle="rgba(0,0,0,.55)";
    const p=new Path2D();p.rect(f.x,f.y,f.w,f.h);
    const q=new Path2D();
    if(shape==="circle")q.ellipse(f.x+f.w/2,f.y+f.h/2,f.w/2,f.h/2,0,0,Math.PI*2);
    else{const r=Math.min(f.w,f.h)*.2,x=f.x,y=f.y,ww=f.w,hh=f.h;q.moveTo(x+r,y);q.arcTo(x+ww,y,x+ww,y+hh,r);q.arcTo(x+ww,y+hh,x,y+hh,r);q.arcTo(x,y+hh,x,y,r);q.arcTo(x,y,x+ww,y,r);q.closePath()}
    p.addPath(q);ctx.fill(p,"evenodd");ctx.strokeStyle="rgba(255,255,255,.9)";ctx.lineWidth=2;ctx.stroke(q);ctx.restore();
  }
  ctx.strokeStyle="rgba(255,255,255,.35)";ctx.lineWidth=1;ctx.beginPath();
  for(let i=1;i<3;i++){ctx.moveTo(f.x+f.w*i/3,f.y);ctx.lineTo(f.x+f.w*i/3,f.y+f.h);ctx.moveTo(f.x,f.y+f.h*i/3);ctx.lineTo(f.x+f.w,f.y+f.h*i/3)}
  ctx.stroke();ctx.strokeStyle="#fff";ctx.lineWidth=1.5;ctx.strokeRect(f.x,f.y,f.w,f.h);
  // live preview
  const a=w/h,pw=a>=1?96:Math.round(96*a),ph=a>=1?Math.round(96/a):96;
  pvc.width=pw;pvc.height=ph;pvx.clearRect(0,0,pw,ph);
  const pf={x:0,y:0,w:pw,h:ph};pvx.save();path(pvx,pf,shape);pvx.clip();drawImg(pvx,pf,1);pvx.restore();
  $("info").textContent="Output: "+w+" x "+h+" px";
}
function exportCanvas(){
  const[w,h]=size(),c=document.createElement("canvas");c.width=w;c.height=h;
  const x=c.getContext("2d"),f={x:0,y:0,w,h},fmt=$("fmt").value;
  if(fmt==="image/jpeg"){x.fillStyle=$("bg").value;x.fillRect(0,0,w,h)}
  x.save();path(x,f,$("shape").value);x.clip();drawImg(x,f,1);x.restore();return c;
}

function load(file){
  if(!file||!file.type.startsWith("image/")){msg("Please choose an image file.",1);return}
  if(S.url)URL.revokeObjectURL(S.url);
  S.url=URL.createObjectURL(file);const im=new Image();
  im.onload=()=>{S.img=im;S.name=(file.name||"image").replace(/\.[^.]+$/,"")||"image";reset();$("main").classList.remove("hide");resize();msg("Loaded "+im.width+" x "+im.height+" px image.");$("main").scrollIntoView({behavior:"smooth",block:"start"})};
  im.onerror=()=>msg("This image could not be opened.",1);im.src=S.url;
}
function reset(){S.rot=0;S.fx=S.fy=1;S.zoom=1;S.ox=S.oy=0;$("zoom").value=100;$("zv").textContent="100%";["br","co","sa"].forEach(i=>$(i).value=100);$("gs").checked=false}

$("drop").onclick=()=>$("file").click();
$("file").onchange=e=>load(e.target.files[0]);
["dragover","dragenter"].forEach(e=>$("drop").addEventListener(e,ev=>{ev.preventDefault();$("drop").classList.add("over")}));
["dragleave","drop"].forEach(e=>$("drop").addEventListener(e,ev=>{ev.preventDefault();$("drop").classList.remove("over")}));
$("drop").addEventListener("drop",ev=>load(ev.dataTransfer.files[0]));
document.addEventListener("paste",e=>{const it=[...(e.clipboardData?.items||[])].find(i=>i.type.startsWith("image/"));if(it)load(it.getAsFile())});

$("preset").onchange=function(){const[w,h]=this.value.split("x");$("tw").value=w;$("th").value=h;S.ox=S.oy=0;render()};
["tw","th"].forEach(i=>$(i).addEventListener("input",()=>{if(S.img){$("preset").selectedIndex=0;render()}}));
["shape","br","co","sa","gs","bg"].forEach(i=>$(i).addEventListener("input",render));
$("zoom").oninput=function(){S.zoom=this.value/100;$("zv").textContent=this.value+"%";render()};
function setZoom(z){S.zoom=Math.min(5,Math.max(1,z));$("zoom").value=Math.round(S.zoom*100);$("zv").textContent=Math.round(S.zoom*100)+"%";render()}
$("rl").onclick=()=>{S.rot=(S.rot+3)%4;S.ox=S.oy=0;render()};
$("rr").onclick=()=>{S.rot=(S.rot+1)%4;S.ox=S.oy=0;render()};
$("fh").onclick=()=>{S.fx*=-1;render()};$("fv").onclick=()=>{S.fy*=-1;render()};
$("rs").onclick=()=>{reset();render()};
$("fmt").onchange=function(){$("qg").style.display=this.value==="image/png"?"none":"block"};
$("q").oninput=function(){$("qv").textContent=this.value+"%"};

// pointer pan + pinch
const ptr=new Map();let pd=0;
$("stage").addEventListener("pointerdown",e=>{if(!S.img)return;e.currentTarget.setPointerCapture(e.pointerId);ptr.set(e.pointerId,{x:e.clientX,y:e.clientY});if(ptr.size===2){const[a,b]=[...ptr.values()];pd=Math.hypot(a.x-b.x,a.y-b.y)}});
$("stage").addEventListener("pointermove",e=>{
  if(!ptr.has(e.pointerId))return;const p=ptr.get(e.pointerId),f=frame();
  if(ptr.size===1){S.ox+=(e.clientX-p.x)/f.w;S.oy+=(e.clientY-p.y)/f.h;ptr.set(e.pointerId,{x:e.clientX,y:e.clientY});render()}
  else{ptr.set(e.pointerId,{x:e.clientX,y:e.clientY});const[a,b]=[...ptr.values()],d=Math.hypot(a.x-b.x,a.y-b.y);if(pd)setZoom(S.zoom*d/pd);pd=d}
});
["pointerup","pointercancel"].forEach(t=>$("stage").addEventListener(t,e=>{ptr.delete(e.pointerId);pd=0}));
$("stage").addEventListener("wheel",e=>{if(!S.img)return;e.preventDefault();setZoom(S.zoom*Math.exp(-e.deltaY*.0015))},{passive:false});
window.addEventListener("resize",()=>{if(S.img)resize()});

$("dl").onclick=()=>{
  if(!S.img){msg("Upload an image first.",1);return}
  const c=exportCanvas(),fmt=$("fmt").value,ext={"image/png":"png","image/jpeg":"jpg","image/webp":"webp"}[fmt];
  c.toBlob(b=>{
    if(!b){msg("Export failed. Try a smaller size or another format.",1);return}
    const u=URL.createObjectURL(b),a=document.createElement("a");
    a.href=u;a.download=`${S.name}-${c.width}x${c.height}.${ext}`;document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(u),1500);msg("Downloaded "+a.download+" ("+(b.size/1024).toFixed(1)+" KB)");
  },fmt,+$("q").value/100);
};
$("cp").onclick=()=>{
  if(!S.img){msg("Upload an image first.",1);return}
  exportCanvas().toBlob(async b=>{try{await navigator.clipboard.write([new ClipboardItem({"image/png":b})]);msg("Image copied to clipboard.")}catch(e){msg("Copy is not supported here. Use Download instead.",1)}},"image/png");
};
</script>
</body>
</html>
